<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
404 | Born of the Spirit and Truth
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
rel="stylesheet">

<style>

/* ===== RESET ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* ===== BODY ===== */

body{

background:#0b0b0b;

font-family:
'Inter',
sans-serif;

color:#fff;

text-align:center;

position:relative;

overflow-x:hidden;

}

/* ===== BACKGROUND ===== */

.background{

position:fixed;

inset:0;

background:
linear-gradient(
rgba(8,8,8,.90),
rgba(8,8,8,.96)
),
url('banner.jpg')
center center/cover
no-repeat;

z-index:-2;

}

.background::after{

content:"";

position:absolute;

inset:0;

background:

radial-gradient(
circle at top left,
rgba(240,215,166,.10),
transparent 35%
),

radial-gradient(
circle at bottom right,
rgba(255,255,255,.04),
transparent 40%
);

}

/* ===== CENTERED PAGE ===== */

.page-wrapper{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:2rem;

}

/* ===== CARD ===== */

.card{

max-width:750px;

padding:4rem 3rem;

border-radius:35px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

animation:fadeUp 1.2s ease;

}

/* ===== TYPOGRAPHY ===== */

.error-code{

font-family:
'Cormorant Garamond',
serif;

font-size:8rem;

font-weight:500;

line-height:1;

color:#f0d7a6;

margin-bottom:1rem;

}

.card h1{

font-family:
'Cormorant Garamond',
serif;

font-size:3.2rem;

font-weight:500;

margin-bottom:1.5rem;

}

.card p{

font-size:1.05rem;

line-height:2;

color:rgba(255,255,255,.78);

margin-bottom:3rem;

}

/* ===== BUTTON ===== */

.button{

display:inline-flex;

align-items:center;

justify-content:center;

padding:1rem 2.2rem;

border-radius:50px;

text-decoration:none;

background:#f0d7a6;

color:#111;

font-size:.92rem;

letter-spacing:.08em;

transition:.35s ease;

}

.button:hover{

background:#fff;

transform:translateY(-2px);

}

/* ===== ANIMATION ===== */

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* ===== MOBILE ===== */

@media(max-width:700px){

.card{

padding:3rem 2rem;

}

.error-code{

font-size:5.5rem;

}

.card h1{

font-size:2.4rem;

}

.card p{

font-size:1rem;

line-height:1.9;

}

.button{

width:100%;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="page-wrapper">

<div class="card">

<div class="error-code">

404

</div>

<h1>

Page Not Found

</h1>

<p>

The page you are searching for may have been moved, renamed, or never existed. Continue your journey through Spirit and truth by returning to the homepage below.

</p>

<a
href="index.html"
class="button">

Return Home

</a>

</div>

</div>

<div id="footer-placeholder"></div>

<script>

fetch('footer.html')
.then(response => response.text())
.then(data => {
document.getElementById(
'footer-placeholder'
).innerHTML = data;
});

</script>

</body>
</html>
